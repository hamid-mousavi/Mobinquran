  <body class="text-slate-800 antialiased selection:bg-teal-200 selection:text-teal-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // اعمال زودهنگام پوسته (تیره پیش‌فرض) برای جلوگیری از چشمک سفید هنگام بارگذاری
      try {
        var saved = JSON.parse(localStorage.getItem('quran_settings') || '{}');
        var isDark = saved.darkMode !== false;
        if (isDark) document.documentElement.classList.add('dark');
        document.body.style.backgroundColor = isDark ? '#0b1120' : '#faf8f5';
      } catch (e) {
        document.documentElement.classList.add('dark');
        document.body.style.backgroundColor = '#0b1120';
      }
    </script>
  </body>
</html>
